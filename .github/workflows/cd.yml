name: KBase CD Pipeline

# Chi chay khi CI Pipeline da pass tren nhanh main
on:
  workflow_run:
    workflows: ["KBase CI Pipeline"]
    branches: ["main"]
    types:
      - completed

jobs:
  deploy-to-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    # Chi deploy neu CI chay thanh cong, khong deploy khi CI fail
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -s --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -o /dev/null -w "HTTP Status: %{http_code}\n"

      - name: Notify Deploy Success
        if: success()
        run: echo "Deploy triggered successfully on Render!"

      - name: Notify Deploy Failure
        if: failure()
        run: echo "Failed to trigger Render deploy. Check RENDER_DEPLOY_HOOK_URL secret."
